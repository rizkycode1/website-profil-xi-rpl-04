<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontak - XI RPL 04</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f4f6f8;
        color: #222;
      }

      header {
        background: #111827;
        color: white;
        padding: 25px;
        text-align: center;
      }

      header h1 {
        margin-bottom: 8px;
      }

      .container {
        width: 90%;
        max-width: 900px;
        margin: 40px auto;
      }

      .contact-card {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      .contact-card h2 {
        margin-bottom: 20px;
        color: #111827;
      }

      .contact-item {
        margin: 18px 0;
        padding: 15px;
        background: #f3f4f6;
        border-radius: 10px;
      }

      .contact-item strong {
        display: block;
        margin-bottom: 5px;
      }

      .contact-item a {
        color: #2563eb;
        text-decoration: none;
      }

      .contact-item a:hover {
        text-decoration: underline;
      }

      footer {
        text-align: center;
        margin-top: 50px;
        padding: 20px;
        background: #111827;
        color: white;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Kontak XI RPL 04</h1>
      <p>Hubungi kami untuk informasi lebih lanjut</p>
    </header>

    <div class="container">
      <div class="contact-card">
        <h2>Hubungi Kami</h2>

        <div class="contact-item">
          <strong>📧 Email</strong>
          <a href="mailto:xirpl04@example.com"> xirpl04@example.com </a>
        </div>

        <div class="contact-item">
          <strong>📱 WhatsApp</strong>
          <a href="#"> Hubungi melalui WhatsApp </a>
        </div>

        <div class="contact-item">
          <strong>📍 Alamat</strong>
          <p>SMK Negeri 1 Garut</p>
        </div>

        <div class="contact-item">
          <strong>📸 Instagram</strong>
          <a href="#"> @xirpl04 </a>
        </div>
      </div>
    </div>

    <footer>
      <p>&copy; 2026 XI RPL 04. All Rights Reserved.</p>
    </footer>
  </body>
</html>
